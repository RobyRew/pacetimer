# XcodeGen spec. Generate the project with:  xcodegen generate
# (brew install xcodegen). CI does this automatically.

name: PaceTimer
options:
  bundleIdPrefix: com.robyrew
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# Sparkle auto-update framework (SwiftPM).
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    PRODUCT_NAME: PeaceTimer
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: PaceTimer.entitlements
    CODE_SIGN_STYLE: Automatic
    # Sign local builds with a STABLE identity. macOS TCC keys the Accessibility
    # grant to the code signature: an ad-hoc/unsigned build gets a new identity on
    # every compile, so the permission has to be granted again and again. With a
    # real team the signature is stable and the grant sticks.
    # (CI overrides this on the command line with CODE_SIGN_IDENTITY="-", so the
    # unsigned release build is unaffected.)
    DEVELOPMENT_TEAM: FJHAUWNNBH
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Latest toolchain: Swift 6 with Xcode 26's "approachable concurrency" —
    # everything is MainActor-isolated by default, which fits a UI app and keeps
    # the strict-concurrency checker quiet without scattering @MainActor everywhere.
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

targets:
  PaceTimer:
    type: application
    platform: macOS
    sources:
      - Sources
      - Assets.xcassets        # contains AppIcon.icon (native Liquid Glass icon)
      # Classic bundle icon. CFBundleIconName alone isn't enough — Finder/Dock and
      # the DMG volume icon need a real .icns in Resources. Generated by
      # Packaging/generate-appicon.swift.
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robyrew.peacetimer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Generates a shared "PaceTimer" scheme so `xcodebuild -scheme PaceTimer` works.
    scheme:
      testTargets: []
