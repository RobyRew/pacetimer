name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: PaceTimer
  PRODUCT_NAME: PeaceTimer
  # Match the dev Mac: Xcode 26.x on the macos-26 arm64 image. Older Xcode ignores
  # the project's Swift 6 settings and can't compile the Liquid Glass `.icon`.
  XCODE_VERSION: '26.3'

jobs:
  build:
    name: Build & Package
    runs-on: macos-26
    timeout-minutes: 40
    env:
      # Surfaced as env because the `secrets` context can't be used in a step-level
      # `if:` — steps gate on these being non-empty.
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
    outputs:
      version: ${{ steps.package.outputs.VERSION }}
      prerelease_tag: ${{ steps.package.outputs.PRERELEASE_TAG }}
      prerelease_version: ${{ steps.package.outputs.PRERELEASE_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer" || {
            echo "::warning::Xcode ${XCODE_VERSION} not found; using latest-stable"
            ls /Applications | grep -i '^Xcode' || true
          }
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (Sparkle)
        run: xcodebuild -resolvePackageDependencies -scheme "$SCHEME" -project "$SCHEME.xcodeproj"

      # Every push produces a genuinely new version: <base>.<run_number>, e.g. 1.0.42.
      # Bump the base (MARKETING_VERSION in project.yml) for a real 1.1 / 2.0.
      - name: Compute version
        id: version
        run: |
          BASE=$(grep -E '^[[:space:]]+MARKETING_VERSION:' project.yml | head -1 | sed 's/.*: *//' | tr -d '"')
          BASE="${BASE:-1.0}"
          VERSION="${BASE}.${{ github.run_number }}"
          echo "VERSION=$VERSION" | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"
          echo "▸ Building version $VERSION (build ${{ github.run_number }})"

      # Optional signing. With MACOS_CERT_P12 + MACOS_CERT_PASSWORD set, the app is
      # signed with a REAL identity, which gives it a stable TeamIdentifier — that is
      # what makes the macOS Accessibility grant survive updates. Without the secrets
      # this is skipped and the build falls back to ad-hoc, exactly as before.
      - name: Import signing certificate (optional)
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "::notice::No MACOS_CERT_P12 secret — building ad-hoc signed (unsigned)."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -oE '"(Developer ID Application|Apple Development)[^"]*"' | head -1 | tr -d '"')
          [ -n "$IDENTITY" ] || { echo "::error::Certificate imported but no codesigning identity found"; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "::notice::Signing as: $IDENTITY"

      - name: Build (Release)
        run: |
          # Monotonic CFBundleVersion so Sparkle can order releases (the project's
          # CURRENT_PROJECT_VERSION is a fixed 1). Ad-hoc signing ("-") so entitlements
          # apply with no Apple certs; every nested binary is re-signed uniformly below.
          xcodebuild \
            -scheme "$SCHEME" \
            -project "$SCHEME.xcodeproj" \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="${{ steps.version.outputs.VERSION }}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            clean build

      - name: Re-sign uniformly (inside-out) & verify
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          # DYLD kills the app if the process and a mapped framework carry different
          # Team IDs. Re-sign every nested Sparkle binary and then the app itself with
          # the SAME identity, inside-out.
          APP="build/Build/Products/Release/$PRODUCT_NAME.app"
          SPK="$APP/Contents/Frameworks/Sparkle.framework"

          # A real certificate can carry the hardened runtime (required for notarising);
          # an ad-hoc, team-less signature cannot — library validation would reject the
          # frameworks at launch.
          EXTRA=()
          [ "$IDENTITY" != "-" ] && EXTRA=(--options runtime --timestamp)

          for target in \
            "$SPK/Versions/B/XPCServices/Downloader.xpc" \
            "$SPK/Versions/B/XPCServices/Installer.xpc" \
            "$SPK/Versions/B/Autoupdate" \
            "$SPK/Versions/B/Updater.app" \
            "$SPK"; do
            [ -e "$target" ] && codesign --force --sign "$IDENTITY" "${EXTRA[@]}" \
                --preserve-metadata=entitlements "$target"
          done
          codesign --force --sign "$IDENTITY" "${EXTRA[@]}" \
              --preserve-metadata=entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "── identity in the shipped bundle ──"
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|TeamIdentifier' || true

      # Notarisation needs a *Developer ID Application* certificate (paid Apple
      # Developer Program) plus App Store Connect API credentials. Gated on the
      # secrets, so CI stays green until they exist.
      - name: Notarise & staple (optional)
        if: ${{ env.AC_API_KEY_P8 != '' && steps.signing.outputs.identity != '-' }}
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          APP="build/Build/Products/Release/$PRODUCT_NAME.app"
          KEY="$RUNNER_TEMP/ac_key.p8"
          printf '%s' "$AC_API_KEY_P8" > "$KEY"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --key "$KEY" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$APP"
          rm -f "$KEY"
          echo "✓ notarised and stapled"

      - name: Package .zip + styled .dmg
        id: package
        run: |
          set -euo pipefail
          APP_DIR="build/Build/Products/Release"
          APP_PATH="$APP_DIR/$PRODUCT_NAME.app"
          test -d "$APP_PATH" || { echo "::error::App not found at $APP_PATH"; find build -name '*.app'; exit 1; }

          # Version comes from the "Compute version" step (<base>.<run_number>), so
          # every push is a new version and needs no alpha counter.
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist")
          echo "VERSION=$VERSION"            >> "$GITHUB_OUTPUT"
          echo "PRERELEASE_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PRERELEASE_TAG=v$VERSION"    >> "$GITHUB_OUTPUT"

          # ZIP (ditto preserves macOS metadata + the code signature).
          ( cd "$APP_DIR" && ditto -c -k --keepParent "$PRODUCT_NAME.app" "$GITHUB_WORKSPACE/$PRODUCT_NAME-$VERSION.zip" )

          # Styled drag-to-Applications DMG. create-dmg drives Finder via AppleScript
          # and can be flaky on CI → 3 attempts, then a plain hdiutil fallback so a
          # release never dies over cosmetics.
          brew install create-dmg
          DMG="$GITHUB_WORKSPACE/$PRODUCT_NAME-$VERSION.dmg"
          STAGE=$(mktemp -d); cp -R "$APP_PATH" "$STAGE/"
          # Use the app's own icon as the mounted volume's icon.
          VOLICON=$(ls "$APP_PATH/Contents/Resources/"*.icns 2>/dev/null | head -1 || true)
          VOLICON_ARGS=()
          [ -n "$VOLICON" ] && VOLICON_ARGS=(--volicon "$VOLICON")
          FANCY_OK=""
          for attempt in 1 2 3; do
            rm -f "$DMG"
            if create-dmg \
                --volname "$PRODUCT_NAME" \
                "${VOLICON_ARGS[@]}" \
                --background "$GITHUB_WORKSPACE/Packaging/dmg-background.tiff" \
                --window-pos 200 120 --window-size 660 400 \
                --icon-size 128 --text-size 13 \
                --icon "$PRODUCT_NAME.app" 165 190 \
                --hide-extension "$PRODUCT_NAME.app" \
                --app-drop-link 495 190 \
                --no-internet-enable \
                "$DMG" "$STAGE"; then FANCY_OK=1; break; fi
            echo "create-dmg attempt $attempt failed — retrying…"; sleep 5
          done
          if [ -z "$FANCY_OK" ]; then
            echo "::warning::create-dmg failed 3× — plain hdiutil fallback"
            rm -f "$DMG"
            hdiutil create -volname "$PRODUCT_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG"
          fi

          # Verify the DMG mounts and carries the installer layout.
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          test -d "$MOUNT/$PRODUCT_NAME.app" || { echo "::error::app missing from DMG"; hdiutil detach "$MOUNT"; exit 1; }
          hdiutil detach "$MOUNT"
          ls -la "$GITHUB_WORKSPACE"/$PRODUCT_NAME-*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeaceTimer-${{ steps.package.outputs.VERSION }}
          path: |
            PeaceTimer-*.zip
            PeaceTimer-*.dmg
          retention-days: 30

  # Alpha pre-release on every push to main (unsigned build for testing).
  pre-release:
    name: Pre-release (Alpha)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # MUST be macOS: Sparkle's `sign_update` (used to EdDSA-sign the update zip) is a
    # Mach-O binary — on a Linux runner it dies with "Exec format error".
    runs-on: macos-26
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      # Empty until you add the repo secret — the appcast steps then no-op (CI stays green).
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          pattern: PeaceTimer-*
          merge-multiple: true

      - name: Create alpha pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.prerelease_tag }}
          name: "PeaceTimer ${{ needs.build.outputs.prerelease_version }}"
          prerelease: true
          generate_release_notes: true
          body: |
            ### ⚡ Automatic alpha build
            **Version:** `${{ needs.build.outputs.prerelease_version }}`
            **Commit:** `${{ github.sha }}`

            > ⚠️ Unsigned build. To open: right-click the app → Open → Open,
            > or run `xattr -cr PeaceTimer.app`.
          files: |
            PeaceTimer-*.zip
            PeaceTimer-*.dmg

      - name: Build signed appcast (Sparkle) — only if key configured
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        env:
          ZIP: PeaceTimer-${{ needs.build.outputs.version }}.zip
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.prerelease_tag }}/PeaceTimer-${{ needs.build.outputs.version }}.zip
          SHORT_VERSION: ${{ needs.build.outputs.prerelease_version }}
          BUILD_VERSION: ${{ github.run_number }}
          CHANNEL: beta
          FEED_URL: https://robyrew.github.io/pacetimer/appcast.xml
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          chmod +x Scripts/publish_appcast.sh
          Scripts/publish_appcast.sh

      - name: Setup Pages
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/configure-pages@v5
      - name: Upload appcast artifact
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy appcast to Pages
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/deploy-pages@v4
